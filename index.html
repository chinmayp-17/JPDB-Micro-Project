<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment Form</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="https://login2explore.com/jpdb/resources/js/0.0.3/jpdb-commons.js"></script>
</head>
<body>
<div class="container">
    <div class="main-container">
        <h2 class="page-title">Student Enrollment Form</h2>
        <p class="page-subtitle"><span class="badge-db">SCHOOL-DB : STUDENT-TABLE</span></p>
        <form id="studentForm" method="post" autocomplete="off" onsubmit="return false;">
            <div class="form-group">
                <label for="rollNo">Roll-No:</label>
                <input type="text" class="form-control" id="rollNo" placeholder="Enter Roll Number" onchange="getStudent()">
            </div>
            <div class="form-group">
                <label for="fullName">Full-Name:</label>
                <input type="text" class="form-control" id="fullName" placeholder="Enter Full Name">
            </div>
            <div class="form-group">
                <label for="class">Class:</label>
                <input type="text" class="form-control" id="class" placeholder="Enter Class">
            </div>
            <div class="form-group">
                <label for="birthDate">Birth-Date:</label>
                <input type="date" class="form-control" id="birthDate">
            </div>
            <div class="form-group">
                <label for="address">Address:</label>
                <input type="text" class="form-control" id="address" placeholder="Enter Address">
            </div>
            <div class="form-group">
                <label for="enrollmentDate">Enrollment-Date:</label>
                <input type="date" class="form-control" id="enrollmentDate">
            </div>
            <div class="form-group button-group">
                <button type="button" class="btn btn-primary" id="save" onclick="saveData()">Save</button>
                <button type="button" class="btn btn-success" id="update" onclick="updateData()">Update</button>
                <button type="button" class="btn btn-danger" id="reset" onclick="resetForm()">Reset</button>
            </div>
        </form>
    </div>
</div>
<script src="index.js"></script>
</body>
</html>
